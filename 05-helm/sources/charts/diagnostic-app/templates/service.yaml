apiVersion: v1
kind: Service
metadata:
  name: {{ include "app1.fullname" . }}
  labels:
    {{- include "app1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http-pod
      protocol: TCP
      name: http-svc
  selector:
    {{- include "app1.selectorLabels" . | nindent 4 }}
