cluster:
  apiServer:
    extraArgs:
      authentication-config: /var/lib/apiserver/authentication.yaml
    extraVolumes:
      - hostPath: /var/lib/apiserver
        mountPath: /var/lib/apiserver
        readonly: true
machine:
  files:
    - content: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
        - issuer:
            url: https://auth.orasuno.pl/application/o/kubernetes/
            audiences:
              - kubernetes
            audienceMatchPolicy: MatchAny
          claimMappings:
            username:
              claim: "preferred_username"
              prefix: ""
            groups:
              claim: "groups"
              prefix: ""
      permissions: 0o444
      path: /var/lib/apiserver/authentication.yaml
      op: create
