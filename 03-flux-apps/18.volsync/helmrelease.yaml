apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync
spec:
  interval: 5m
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: volsync
      version: ">=0.10.0-0"
      sourceRef:
        kind: HelmRepository
        name: volsync
        namespace: flux-system
  values: {}
