apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homelab-secretstore
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200

      path: secret
      version: v2

      # CA used to verify the OpenBao server certificate.
      caProvider:
        type: ConfigMap
        namespace: external-secrets
        name: openbao-ca
        key: ca.crt

      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
