apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: tofu-controller
spec:
  interval: 5m

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: tofu-controller
      version: ">=0.16.4-0"
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
  values:
    allowCrossNamespaceRefs: true
    watchAllNamespaces: true
    branchPlanner:
      enabled: true
    runner:
      serviceAccount:
        allowedNamespaces:
          - flux-system
          - openbao