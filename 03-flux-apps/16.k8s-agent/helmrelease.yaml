apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: kagent
spec:
  interval: 5m

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: kagent-crds
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 5m

  dependsOn:
    - name: kagent-crds

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: kagent
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system

  values:
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: "deepseek/deepseek-v4.1-flash"
        apiKeySecretRef: openrouter-api-key
        apiKeySecretKey: OPENROUTER-API-KEY
        config:
          baseUrl: "https://openrouter.ai/api/v1"

