apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ente
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      name: ente-ente-photos-museum
      namespace: ente
      jqPointers:
        - /spec
        - /metadata/annotations
        - /metadata/labels
  source:
    repoURL: https://l4gdev.github.io/helm-charts
    chart: ente-photos
    targetRevision: 0.2.0
    helm:
      releaseName: ente
      valuesObject:
        museum:
          image:
            repository: ghcr.io/ente/server
            tag: "0472c929b6070e61fecaf2013d47efce2dcda462"
            pullPolicy: IfNotPresent
          ingress:
            enabled: true
            hosts:
              - host: api-ente.akna.one.pl
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - api-ente.akna.one.pl
        web:
          image:
            repository: ghcr.io/ente/web
            tag: "a0374add988ad4fc5c6dcf11cc083dfe7d746602"
            pullPolicy: IfNotPresent
          photos:
            env:
              - name: ENTE_API_ORIGIN
                value: "https://api-ente.akna.one.pl"
          auth:
            env:
              - name: ENTE_API_ORIGIN
                value: "https://api-ente.akna.one.pl"
          accounts:
            env:
              - name: ENTE_API_ORIGIN
                value: "https://api-ente.akna.one.pl"
          albums:
            env:
              - name: ENTE_API_ORIGIN
                value: "https://api-ente.akna.one.pl"
        networkPolicy:
           enabled: false        
        credentials:
          existingSecret: "ente-credentials"
        externalDatabase:
          host: "ente-postgres-rw.ente.svc.cluster.local"
          port: 5432
          database: "ente_db"
          user: "ente"
          existingSecret:
            enabled: true
            secretName: "ente-postgres-app"
            passwordKey: "password"
  destination:
    server: https://kubernetes.default.svc
    namespace: ente
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    #automated:
    #  prune: true
    #  selfHeal: true
