apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ente-postgres
  namespace: ente
spec:
  instances: 2
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:17-system-trixie

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  managed:
    roles:
      - name: ente
        ensure: present
        login: true
        createdb: true
        connectionLimit: -1
        inherit: true
    databases:
      ente_db:
        owner: ente
    services:
      disabledDefaultServices: ["ro", "r"]

  bootstrap:
    initdb:
      database: ente_db
      owner: ente

  storage:
    size: 5Gi
    storageClass: "openebs-lvm"
    resizeInUseVolumes: False
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  backup:
    barmanObjectStore:
      destinationPath: "s3://ente-s3-backups/"
      endpointURL: "http://seaweed.akna.lan:8333"
      s3Credentials:
        accessKeyId:
          name: ente-s3-backup
          key: accessKeyId
        secretAccessKey:
          name: ente-s3-backup
          key: secretAccessKey
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
